# Files that cannot carry a header: pinned masters, binaries and JSON.

version = 1

[[annotations]]
path = [
  "assets/**",
  "designs/**",
  "embed/*.png",
  "package.json",
  "package-lock.json",
  "biome.json",
  "tsconfig.json",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 l5yth"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = "upstream/40c3-styleguide/**"
precedence = "override"
SPDX-FileCopyrightText = "2026 40C3 design team"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = "upstream/40c3-styleguide/fonts/jersey-10*"
precedence = "override"
SPDX-FileCopyrightText = "2023 The Soft Type Project Authors"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = "upstream/40c3-styleguide/fonts/Hack*"
precedence = "override"
SPDX-FileCopyrightText = ["2018 Source Foundry Authors", "2003 Bitstream, Inc."]
SPDX-License-Identifier = "MIT AND Bitstream-Vera"
